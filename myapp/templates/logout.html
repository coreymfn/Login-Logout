{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <link rel="stylesheet" href="{% static 'logout.css' %}">
</head>
<body>

    <div class="logout-container">
        <h1>Are you sure?</h1>

        <p>Would you like to log out of your account?</p>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Yes, Logout</button>
        </form>

        <a href="{% url 'home' %}">Cancel</a>
    </div>

</body>
</html>
